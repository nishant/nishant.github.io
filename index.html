<!doctype html>
<html lang="en" data-nish-themes="dark light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Nish's start page" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Start</title>
    <script>
      // Applies the saved font before first paint (mirrors fontStack in src/lib/font.ts; keep the two in step).
      (function () {
        try {
          var f = localStorage.getItem('nishant.github.io-font') || 'Fira Code';
          var stack;
          if (f === 'Fira Code') stack = "'Fira Code Variable', 'Fira Code', ui-monospace, monospace";
          else if (f === 'Roboto') stack = "'Roboto Variable', 'Roboto', system-ui, sans-serif";
          else stack = "'" + f + "', " + (f.indexOf('Courier') === 0 ? 'ui-monospace, monospace' : 'system-ui, sans-serif');
          document.documentElement.style.setProperty('--app-font', stack);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
