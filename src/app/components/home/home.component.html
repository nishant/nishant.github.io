<div class="home-container">
  <div class="search-block">
    <form id="search-form" action="https://google.com/search" method="get" (submit)="onSearch()">
      <input type="text" name="search" id="search" autofocus="autofocus" autocomplete="off" placeholder="Search" />
      <label for="search"><span id="search-icon" class="fa fa-search"></span></label>
    </form>
    <ul id="search-help" class="search-help" style="opacity: 0;"></ul>
  </div>

  <div class="blocks">
    <ul *ngFor="let section of config?.sections" class="block">
      <li class="header">{{ section.header }}</li>
      <li *ngFor="let link of section.links" class="links">
        <span class="link-icon">
          <img class="icon" [ngSrc]="getFavicon(link.url)" width="16" height="16" alt=""/>
        </span>
        <a href="{{link.url}}">{{ link.text }}</a>
      </li>
    </ul>
  </div>

  <div id="apps-container">
    <button type="button" class="nish-icon-btn app-button" title="Notes" aria-label="Notes" (click)="toggleNotes()">
      <span class="material-symbols-outlined" aria-hidden="true">description</span>
    </button>
    <button type="button" class="nish-icon-btn app-button" title="Weather" aria-label="Weather" (click)="toggleWeather()">
      <span class="material-symbols-outlined" aria-hidden="true">partly_cloudy_day</span>
    </button>
    <button type="button" class="nish-icon-btn app-button" title="Stocks" aria-label="Stocks" (click)="toggleStocks()">
      <span class="material-symbols-outlined" aria-hidden="true">query_stats</span>
    </button>
    <button type="button" class="nish-icon-btn app-button" title="Email" aria-label="Email" (click)="toggleEmail()">
      <span class="material-symbols-outlined" aria-hidden="true">email</span>
    </button>
    <button type="button" class="nish-icon-btn app-button" title="Settings" aria-label="Settings" (click)="toggleSettings()">
      <span class="material-symbols-outlined" aria-hidden="true">settings</span>
    </button>
  </div>
</div>

<div class="center" id="login-btn">
  <asl-google-signin-button
    type="standard"
    size="medium"
    theme="filled_black"
    width="200"
  >
  </asl-google-signin-button>
</div>

<!--<button (click)="signOut()">Sign out</button>-->

<ng-template #notes>
  <app-notes />
</ng-template>

<ng-template #settings>
  <app-settings />
</ng-template>

<ng-template #weather>
  <app-weather />
</ng-template>

<ng-template #email>
  <app-email />
</ng-template>
