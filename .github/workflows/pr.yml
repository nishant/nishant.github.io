# Checks every pull request. `check` mirrors the check job in deploy.yml: keep them in step.
# `fold` renders the PR and its base branch, diffs the pages and posts the result on the PR
# (nishant/ui docs/fold-check.md). It runs only for @nish/ui bumps, Dependabot and PRs
# labeled `fold`.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: { contents: read, pull-requests: write }

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build --outDir /tmp/start-check
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server

  fold:
    if: startsWith(github.head_ref, 'ui/') || github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'fold')
    uses: nishant/ui/.github/workflows/fold-check.yml@master
    with:
      node-version: '22'
